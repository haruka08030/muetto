include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    # 未使用のインポートやデッドコードは CI で落とす
    unused_import: error
    unused_local_variable: error
    dead_code: error

linter:
  rules:
    - always_declare_return_types
    - prefer_single_quotes
    - prefer_final_locals
    - avoid_print
    - unawaited_futures
